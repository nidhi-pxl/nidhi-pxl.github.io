<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Animals Album</title>

  <!-- Your CSS -->
  <link rel="stylesheet" href="css/style.css" />
  
  <!-- LightGallery CSS -->
  <link href="https://cdn.jsdelivr.net/npm/lightgallery@2.7.2/css/lightgallery-bundle.min.css" rel="stylesheet" />

  <!-- JustifiedGallery CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/justifiedGallery@3.8.1/dist/css/justifiedGallery.min.css" />

  <!-- jQuery (must come before using $/jQuery) -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>

  <!-- JustifiedGallery JS -->
  <script src="https://cdn.jsdelivr.net/npm/justifiedGallery@3.8.1/dist/js/jquery.justifiedGallery.min.js"></script>
</head>

<body>
  <header>
    <h1>Animals</h1>
    <a href="index.html" style="color: white;">← Back to Home</a>
  </header>

  <main>
    <div class="gallery-section">
      <div id="animals-gallery" class="justified-gallery"></div>
    </div>
  </main>

 <!-- LightGallery JS -->
  <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.2/lightgallery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.2/plugins/zoom/lg-zoom.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.2/plugins/thumbnail/lg-thumbnail.min.js"></script>

  <script>
    const container = document.getElementById("animals-gallery");

    fetch("images.json")
      .then(res => res.json())
      .then(data => {
        data.animals.forEach(({ file, caption, alt }) => {
          const fullSrc  = `/images/animals/${file}`;
          const thumbSrc = `/images/animals/thumbs/${file}`;

          const link = document.createElement("a");
          link.href = fullSrc;
          link.setAttribute("data-sub-html", caption || `<h4>${file}</h4>`);

          const img = document.createElement("img");
          img.src = thumbSrc;
          img.alt = alt;
          img.loading = "lazy";
          img.onload = () => {
            if (img.naturalWidth < 300 || img.naturalHeight < 300) {
              img.src = fullSrc;
            }
          };

          link.appendChild(img);
          container.appendChild(link);
        });

        initGallery();
      });

    function initGallery() {
      $(document).ready(function () {
        const rowHeight = window.innerWidth > 1600 ? 160 : 200;
        $('#animals-gallery').justifiedGallery({
          rowHeight: rowHeight,
          margins: 4,
          lastRow: 'justify'
        }).on('jg.complete', function () {
          lightGallery(document.getElementById('animals-gallery'), {
            plugins: [lgZoom, lgThumbnail],
            speed: 500,
            download: false,
            doubleTapZoom: 1.2
          });
        });
      });
    }
  </script>


</body>
</html>
