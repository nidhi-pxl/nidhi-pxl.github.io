<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nidhi Mekaraj - Photography Portfolio</title>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- LightGallery CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lightgallery@2.7.1/css/lightgallery-bundle.min.css" />
  <!-- JustifiedGallery CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/justifiedGallery@3.8.1/dist/css/justifiedGallery.min.css" />

  <script>
    // Clean URL: Automatically remove trailing .html from address bar
    if (window.location.pathname.endsWith('.html')) {
      const cleanPath = window.location.pathname.replace(/\/index\.html$/, '/').replace(/\.html$/, '');
      window.history.replaceState(null, '', cleanPath + window.location.search + window.location.hash);
    }
  </script>
</head>
<body>
  <header id="site-header">
    <h1>Nidhi Mekaraj<span class="header-subtitle">Photography Portfolio</span></h1>
    <div class="header-nav">
      <a href="https://www.instagram.com/nidhi.pxl/" target="_blank" rel="noopener noreferrer" class="instagram-link" title="Instagram @nidhi.pxl">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
        <span>@nidhi.pxl</span>
      </a>
    </div>
  </header>

  <main>
    <div class="albums">
      <a href="flowers" class="album-card flowers">
        <h2>Flowers</h2>
      </a>
      <a href="skies" class="album-card skies">
        <h2>Skies</h2>
      </a>
      <a href="animals" class="album-card animals">
        <h2>Animals</h2>
      </a>
      <a href="landscapes" class="album-card landscapes">
        <h2>Landscapes</h2>
      </a>
      <a href="insects" class="album-card insects">
        <h2>Insects</h2>
      </a>
      <a href="astro" class="album-card astro">
        <h2>Astro</h2>
      </a>
    </div>

    <!-- Gallery Section -->
    <div class="gallery-section">
      <h2>「 ✦ Gallery ✦ 」</h2>
      <div id="loading-spinner" class="spinner"></div>
      <div id="lightgallery" class="justified-gallery"></div>
    </div>
  </main>

  <!-- Scroll To Top Button -->
  <button id="scrollToTop" title="Back to Top" onclick="scrollToTop()">↑</button>

  <!-- jQuery -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>

  <!-- JustifiedGallery -->
  <script src="https://cdn.jsdelivr.net/npm/justifiedGallery@3.8.1/dist/js/jquery.justifiedGallery.min.js"></script>

  <!-- LightGallery -->
  <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.1/lightgallery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.1/plugins/thumbnail/lg-thumbnail.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.1/plugins/zoom/lg-zoom.min.js"></script>

  <script>
    // Prevent Right-Click & Image Dragging to protect images
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('dragstart', (e) => e.preventDefault());

    const gallery = document.getElementById('lightgallery');
    const spinner = document.getElementById('loading-spinner');

    let shuffled = [];
    let loadedCount = 0;
    const batchSize = 20;
    let isLoading = false;
    let lgInstance = null;

    function loadBatch() {
      if (loadedCount >= shuffled.length) return;

      const batch = shuffled.slice(loadedCount, loadedCount + batchSize);

      batch.forEach(({ src, thumb, caption, alt, folder }) => {
        const a = document.createElement('a');
        a.href = src;
        a.dataset.folder = folder;

        const albumLabel = folder ? folder.charAt(0).toUpperCase() + folder.slice(1) : '';
        const albumBtnHtml = folder ? `<a class="lg-album-link" href="${folder}">→ ${albumLabel}</a>` : '';
        const captionTextHtml = caption ? `<div>${caption}</div>` : '';
        const fullSubHtml = `<div class="lg-caption-wrap">${captionTextHtml}${albumBtnHtml}</div>`;

        a.setAttribute('data-sub-html', fullSubHtml);
        a.classList.add("gallery-item");

        const img = document.createElement('img');
        img.src = thumb;
        img.alt = alt || "";
        img.loading = "lazy";

        a.appendChild(img);
        gallery.appendChild(a);
      });

      loadedCount += batch.length;

      $('#lightgallery').justifiedGallery('norewind');
      
      if (lgInstance) {
        lgInstance.refresh();
      }

      isLoading = false;
    }

    fetch("images.json")
      .then(res => res.json())
      .then(data => {
        const images = [];
        for (const [folder, entries] of Object.entries(data)) {
          entries.forEach(({ file, caption, alt }) => {
            images.push({
              src:     `images/${folder}/${file}`,
              thumb:   `images/${folder}/thumbs/${file}`,
              caption: caption || "",
              alt:     alt || "",
              folder:  folder
            });
          });
        }

        shuffled = images.sort(() => 0.5 - Math.random());

        $(function () {
          const rowHeight = window.innerWidth > 1600 ? 160 : 200;

          $('#lightgallery').justifiedGallery({
            rowHeight: rowHeight,
            margins: 6,
            lastRow: 'justify'
          }).on('jg.complete', function () {
            if (!lgInstance) {
              lgInstance = lightGallery(document.getElementById('lightgallery'), {
                selector: '.gallery-item',
                thumbnail: true,
                zoom: true,
                download: false,
                share: false,
                actualSize: false,
                plugins: [lgZoom, lgThumbnail],
                zoomFromOrigin: true,
                scale: 1,
                enableZoomAfter: 300,
                doubleTapZoom: 2
              });
            } else {
              lgInstance.refresh();
            }

            spinner.style.display = 'none';
          });

          loadBatch();
        });
      });

    // Infinite Scroll
    window.addEventListener('scroll', () => {
      const nearBottom = window.innerHeight + window.scrollY >= document.body.offsetHeight - 300;

      if (nearBottom && !isLoading && loadedCount < shuffled.length) {
        isLoading = true;
        spinner.style.display = 'block';

        setTimeout(() => {
          loadBatch();
          spinner.style.display = 'none';
        }, 300);
      }

      document.getElementById('scrollToTop').classList.toggle('show', window.scrollY > 300);
    });

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Header opacity fade out on scroll
    (function () {
      const header = document.getElementById('site-header');

      function syncHeaderOffset() {
        document.documentElement.style.setProperty(
          '--header-height', header.offsetHeight + 'px'
        );
      }
      syncHeaderOffset();
      window.addEventListener('resize', syncHeaderOffset, { passive: true });

      window.addEventListener('scroll', () => {
        const fadeDistance = header.offsetHeight;
        const opacity = Math.max(0, 1 - window.scrollY / fadeDistance);
        header.style.opacity = opacity;
        header.style.pointerEvents = opacity === 0 ? 'none' : '';
      }, { passive: true });
    })();
  </script>
</body>
</html>
