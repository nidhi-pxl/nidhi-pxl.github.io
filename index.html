<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nidhi Mekaraj - Photography Portfolio</title>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- LightGallery CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lightgallery@2.7.1/css/lightgallery-bundle.min.css" />
  <!-- JustifiedGallery CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/justifiedGallery@3.8.1/dist/css/justifiedGallery.min.css" />
</head>
<body>
  <header id="site-header">
    <h1>Nidhi Mekaraj<span class="header-subtitle">Photography Portfolio</span></h1>
  </header>

  <main>
    <div class="albums">
      <a href="flowers.html" class="album-card flowers">
        <h2>Flowers</h2>
      </a>
      <a href="skies.html" class="album-card skies">
        <h2>Skies</h2>
      </a>
      <a href="animals.html" class="album-card animals">
        <h2>Animals</h2>
      </a>
      <a href="landscapes.html" class="album-card landscapes">
        <h2>Landscapes</h2>
      </a>
      <a href="insects.html" class="album-card insects">
        <h2>Insects</h2>
      </a>
      <a href="astro.html" class="album-card astro">
        <h2>Astro</h2>
      </a>
    </div>

    <!-- Gallery Section -->
    <div class="gallery-section">
      <h2>「 ✦ Gallery ✦ 」</h2>
      <div id="loading-spinner" class="spinner"></div>
      <div id="lightgallery" class="justified-gallery"></div>
    </div>
  </main>

  <!-- Scroll To Top Button -->
  <button id="scrollToTop" title="Back to Top" onclick="scrollToTop()">↑</button>

  <!-- jQuery -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>

  <!-- JustifiedGallery -->
  <script src="https://cdn.jsdelivr.net/npm/justifiedGallery@3.8.1/dist/js/jquery.justifiedGallery.min.js"></script>

  <!-- LightGallery -->
  <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.1/lightgallery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.1/plugins/thumbnail/lg-thumbnail.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.1/plugins/zoom/lg-zoom.min.js"></script>

  <script>
    const gallery = document.getElementById('lightgallery');
    const spinner = document.getElementById('loading-spinner');

    let shuffled = [];
    let loadedCount = 0;
    const batchSize = 20;
    let isLoading = false;

    function loadBatch() {
      if (loadedCount >= shuffled.length) return;

      const batch = shuffled.slice(loadedCount, loadedCount + batchSize);

      batch.forEach(({ src, thumb, caption, alt, folder }) => {
        const a = document.createElement('a');
        a.href = src;
        a.dataset.folder = folder;

        a.setAttribute('data-sub-html', caption
          ? `<div class="lg-caption-wrap">${caption}</div>`
          : '');

        a.classList.add("gallery-item");

        const img = document.createElement('img');
        img.src = thumb;
        img.alt = alt || "";

        a.appendChild(img);
        gallery.appendChild(a);
      });

      loadedCount += batchSize;
      $('#lightgallery').justifiedGallery('norewind');
      isLoading = false;
    }

    fetch("images.json")
      .then(res => res.json())
      .then(data => {
        const images = [];
        for (const [folder, entries] of Object.entries(data)) {
          entries.forEach(({ file, caption, alt }) => {
            images.push({
              src:     `/images/${folder}/${file}`,
              thumb:   `/images/${folder}/thumbs/${file}`,
              caption: caption || "",
              alt:     alt || "",
              folder:  folder
            });
          });
        }

        shuffled = images.sort(() => 0.5 - Math.random());

        $(function () {
          const rowHeight = window.innerWidth > 1600 ? 160 : 200;

          $('#lightgallery').justifiedGallery({
            rowHeight: rowHeight,
            margins: 4,
            lastRow: 'justify'
          }).on('jg.complete', function () {
            const lg = lightGallery(document.getElementById('lightgallery'), {
              selector: '.gallery-item',
              thumbnail: true,
              zoom: true,
              download: false,
              share: false,
              actualSize: false,
              plugins: [lgZoom, lgThumbnail],
              zoomFromOrigin: true,
              scale: 1,
              enableZoomAfter: 300,
              doubleTapZoom: 2
            });

            // Inject the album link after each slide renders, outside lightGallery's
            // click handler scope so the anchor navigates normally
            document.getElementById('lightgallery').addEventListener('lgAfterSlide', (e) => {
              const subHtml = document.querySelector('.lg-sub-html');
              if (!subHtml) return;

              // Remove any previously injected link
              const existing = subHtml.querySelector('.lg-album-link');
              if (existing) existing.remove();

              // Read the folder from the active gallery item's data attribute
              const items = document.querySelectorAll('#lightgallery .gallery-item');
              const activeItem = items[e.detail.index];
              if (!activeItem) return;

              const folder = activeItem.dataset.folder;
              if (!folder) return;

              const label = folder.charAt(0).toUpperCase() + folder.slice(1);
              const link = document.createElement('a');
              link.className = 'lg-album-link';
              link.href = `${folder}.html`;
              link.textContent = `→ ${label}`;

              subHtml.appendChild(link);
            });

            spinner.style.display = 'none';
          });

          loadBatch();
        });
      });

    // Infinite Scroll
    window.addEventListener('scroll', () => {
      const nearBottom = window.innerHeight + window.scrollY >= document.body.offsetHeight - 200;

      if (nearBottom && !isLoading && loadedCount < shuffled.length) {
        isLoading = true;
        spinner.style.display = 'block';

        setTimeout(() => {
          loadBatch();
          spinner.style.display = 'none';
        }, 500);
      }

      document.getElementById('scrollToTop').classList.toggle('show', window.scrollY > 300);
    });

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Fade header out as user scrolls down
    (function () {
      const header = document.getElementById('site-header');
      const fadeDistance = 300; // px of scroll over which it fully fades

      window.addEventListener('scroll', () => {
        const y = window.scrollY;
        const opacity = Math.max(0, 1 - y / fadeDistance);
        header.style.opacity = opacity;
        // also collapse pointer events once invisible so it doesn't block clicks
        header.style.pointerEvents = opacity === 0 ? 'none' : '';
      }, { passive: true });
    })();
  </script>
</body>
</html>
